name: svitlo
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svitlo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google Chrome вже стоїть на ubuntu-latest, браузер не качаємо
      - run: node monitor.mjs
        env:
          TZ: Europe/Kyiv
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TELEGRAM_CHAT_ID: "@fortunatraking"
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      - name: save state
        if: always()
        run: |
          git config user.name svitlo-bot
          git config user.email svitlo-bot@users.noreply.github.com
          git add state.bin
          git diff --cached --quiet && exit 0
          git commit -qm "state"
          # якщо поки бот працював у main прилетів код - підтягуємо і пушимо ще раз
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase && sleep $i; done
          exit 1
